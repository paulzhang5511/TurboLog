name: Build AAR

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build TurboLog SDK AAR
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always
      ANDROID_MIN_SDK: "29"
      ANDROID_COMPILE_SDK: "36"
      ANDROID_NDK_VERSION: "27.0.12077973"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rustlib/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rustlib/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Android SDK
        run: |
          # Determine ANDROID_HOME
          if [ -z "${ANDROID_HOME}" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            # Try to find sdkmanager
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          # Accept all licenses
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # Install required SDK components
          echo "Installing Android SDK components..."
          yes | "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;${ANDROID_NDK_VERSION}" \
            > /dev/null

          echo "Android SDK components installed."

          # Set NDK home (side-by-side layout)
          NDK_PATH="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

          # Create local.properties for AGP
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$NDK_PATH" >> local.properties

          echo ""
          echo "=== Environment ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$NDK_PATH"
          echo "Java version:"
          java -version
          echo ""
          echo "=== NDK directory ==="
          ls -la "$NDK_PATH" | head -20

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk &>/dev/null; then
            echo "Installing cargo-ndk..."
            cargo install cargo-ndk --locked
          else
            echo "cargo-ndk already installed: $(cargo-ndk --version)"
          fi

      - name: Build Rust native libraries
        working-directory: rustlib
        run: |
          echo "=== NDK path: $ANDROID_NDK_HOME ==="
          echo "=== NDK toolchains ==="
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/" 2>/dev/null || true
          echo ""
          echo "Building Rust libraries for all Android targets..."
          cargo ndk \
            --platform ${{ env.ANDROID_MIN_SDK }} \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android \
            build --release

      - name: Copy .so files to JNI Libs directory
        run: |
          JNI_DIR="sdk/src/main/jniLibs"
          RUST_TARGET_DIR="rustlib/target"

          rm -rf "$JNI_DIR"
          mkdir -p "$JNI_DIR/arm64-v8a"
          mkdir -p "$JNI_DIR/armeabi-v7a"
          mkdir -p "$JNI_DIR/x86_64"

          cp "$RUST_TARGET_DIR/aarch64-linux-android/release/libturbolog_sdk.so" "$JNI_DIR/arm64-v8a/"
          cp "$RUST_TARGET_DIR/armv7-linux-androideabi/release/libturbolog_sdk.so" "$JNI_DIR/armeabi-v7a/"
          cp "$RUST_TARGET_DIR/x86_64-linux-android/release/libturbolog_sdk.so" "$JNI_DIR/x86_64/"

          echo "=== JNI Libs contents ==="
          find "$JNI_DIR" -type f -name "*.so" -exec ls -lh {} \;

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build AAR with Gradle
        run: ./gradlew :sdk:assembleRelease

      - name: Verify AAR contents
        run: |
          AAR_FILE="sdk/build/outputs/aar/sdk-release.aar"
          echo "=== AAR file info ==="
          ls -lh "$AAR_FILE"
          echo ""
          echo "=== AAR native libs ==="
          unzip -l "$AAR_FILE" | grep -E "\.so$" || echo "WARNING: No .so files found in AAR!"
          echo ""
          echo "=== All AAR entries ==="
          unzip -l "$AAR_FILE"

      - name: Prepare output
        id: version
        run: |
          VERSION=$(grep '^version' rustlib/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          mkdir -p output
          cp sdk/build/outputs/aar/sdk-release.aar "output/turbolog-sdk-${VERSION}.aar"
          echo "=== Output file ==="
          ls -lh "output/turbolog-sdk-${VERSION}.aar"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: turbolog-sdk-${{ steps.version.outputs.version }}
          path: output/turbolog-sdk-${{ steps.version.outputs.version }}.aar

      - name: Create Release and upload AAR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/turbolog-sdk-${{ steps.version.outputs.version }}.aar
          generate_release_notes: true
